name: Code Quality Checks

on:
  push:
    branches:
      - B02
  pull_request:
    branches:
      - main

jobs:
  ci:
    # 1. 실행 환경을 표준인 ubuntu-latest로 변경
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'password' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'test_db' }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'postgres' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'password' }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'test_db' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # 최신 v4로 업데이트

    - name: Set up Python
      uses: actions/setup-python@v5 # 최신 v5로 업데이트
      with:
        python-version: '3.12'

    # 2. uv 설치 공식 액션 사용 (더 빠르고 안전함)
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true # 빌드 속도 향상을 위한 캐시 활성화

    # 3. 에러 발생했던 부분 수정: --dev-packages 제거
    - name: Install Packages & Libraries
      run: uv sync

    - name: Run ruff (Linting)
      run: uv run ruff check .

    - name: Run Django Migration
      env:
        # DB 연결 정보 설정 (Postgres 서비스 주소 사용)
        DATABASE_URL: postgres://${{ secrets.POSTGRES_USER || 'postgres' }}:${{ secrets.POSTGRES_PASSWORD || 'password' }}@postgres:5432/${{ secrets.POSTGRES_DB || 'test_db' }}
        DJANGO_SETTINGS_MODULE: config.settings.dev # 개발용 설정 사용 확인
      run: |
        uv run python manage.py migrate

    - name: Run Django Tests
      env:
        DATABASE_URL: postgres://${{ secrets.POSTGRES_USER || 'postgres' }}:${{ secrets.POSTGRES_PASSWORD || 'password' }}@postgres:5432/${{ secrets.POSTGRES_DB || 'test_db' }}
        DJANGO_SETTINGS_MODULE: config.settings.dev
      run: uv run python manage.py test
