<!DOCTYPE html>
{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm mt-5">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">회원가입</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">가입하기</button>
                </form>
                <hr>
                <p class="text-center">이미 계정이 있으신가요? <a href="{% url 'users:login' %}">로그인</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
